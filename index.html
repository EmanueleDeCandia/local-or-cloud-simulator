<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulatore v2 — AI Locale vs Cloud + API · tempo per task, dati, integrazioni</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface2:#f1f3f6;--line:#e3e6eb;--line2:#cfd4dc;
  --tx:#111827;--tx2:#5b6472;--tx3:#8a93a2;
  --loc:#1f2937;--cld:#2563eb;            /* Locale = antracite, Cloud = blu: unica codifica cromatica */
  --ok:#15803d;--bad:#b91c1c;--warn:#a16207;
  --r:10px;--r-sm:6px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:var(--s3) var(--s5);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
header>div:first-child{min-width:0;flex:1 1 420px}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
header .sub{color:var(--tx2);font-size:12px;margin-top:2px}
#status{flex-basis:100%;order:9;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;padding-top:var(--s1);border-top:1px dashed var(--line);margin-top:var(--s1)}
button{background:var(--surface);color:var(--tx);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 12px;font:500 13px var(--font);cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{background:var(--surface2);border-color:#b9c0cb}
button:focus-visible{outline:2px solid var(--cld);outline-offset:1px}
button.primary{background:var(--tx);color:#fff;border-color:var(--tx)}button.primary:hover{background:#000}
button.mini{padding:3px 8px;font-size:11.5px}
#quickBtn{border-color:var(--tx)}
/* ---------- layout ---------- */
main{display:grid;grid-template-columns:400px minmax(0,1fr);grid-auto-flow:dense;gap:var(--s5);padding:var(--s5);max-width:1900px;margin:0 auto}
@media(max-width:1100px){main{grid-template-columns:1fr}aside{position:static!important;max-height:none!important}}
aside{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-self:start;position:sticky;top:72px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:var(--s1);padding:var(--s3);border-bottom:1px solid var(--line);background:var(--surface2)}
.tabs button{padding:4px 9px;font-size:12px;border-radius:999px;border-color:transparent;background:transparent;color:var(--tx2)}
.tabs button:hover{background:#e7eaef;color:var(--tx)}
.tabs button.active{background:var(--tx);color:#fff}
.tabbody{overflow-y:auto;overflow-x:hidden;padding:var(--s4);flex:1}
.sec{display:none}.sec.active{display:block}
.sec h3{margin:0 0 var(--s3);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--tx2)}
.sec h4{margin:var(--s4) 0 var(--s2);font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
/* ---------- fields ---------- */
.f{display:grid;grid-template-columns:1fr 112px;gap:var(--s2);align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{font-size:12.5px;color:var(--tx)}.f label small{display:block;color:var(--tx3);font-size:11px;line-height:1.35}
.f input,.f select,.tt input,.tt select,.qf input,.qf select,.src input,.src select{width:100%;background:var(--surface);border:1px solid var(--line2);color:var(--tx);border-radius:var(--r-sm);padding:6px 8px;font:13px var(--font);font-variant-numeric:tabular-nums;transition:border-color .12s,box-shadow .12s}
.f input:hover,.f select:hover{border-color:#b9c0cb}
.f input:focus,.f select:focus,.tt input:focus,.qf input:focus,.qf select:focus{outline:none;border-color:var(--cld);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.f input.dirty{border-color:var(--tx);background:#fafbfc}
.f .u{position:relative}.f .u span{position:absolute;right:8px;top:7px;font-size:10.5px;color:var(--tx3);pointer-events:none}
.src{display:grid;grid-template-columns:1fr 84px 96px;gap:var(--s2);margin:0 0 var(--s3)}
.src input,.src select{border-style:dashed;color:var(--tx2);font-size:12px;padding:5px 7px}
.note{font-size:12px;color:var(--tx2);background:var(--surface2);border-left:2px solid var(--tx);padding:8px 10px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 var(--s3)}
.chk{display:flex;gap:var(--s2);align-items:flex-start;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line)}.chk input{width:15px;height:15px;margin-top:2px;accent-color:var(--tx)}
.tt{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:var(--s2);table-layout:fixed}
.tt th,.tt td{padding:3px 2px;border-bottom:1px solid var(--line)}
.tt th{color:var(--tx3);font-weight:500;font-size:10.5px;text-align:left}
.tt input{padding:4px 3px;font-size:11px;min-width:0}.tt td.n{width:44px}.tt td:first-child{width:22%}
.integ{display:grid;grid-template-columns:1fr;gap:var(--s2)}
.ib{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:12px}
.ib .hd{display:flex;gap:var(--s2);align-items:center}.ib .hd label{flex:1;font-weight:500}.ib .hd input{accent-color:var(--tx)}
.ib .g{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);margin-top:6px}
.ib .g div{font-size:10.5px;color:var(--tx3)}.ib .g input{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:3px 5px;font:11.5px var(--font)}
/* ---------- cards ---------- */
#cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);align-content:start;min-width:0}
@media(max-width:1500px){#cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);min-width:0;max-width:100%;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.full{grid-column:1/-1}
.card h2{font-size:15px;margin:0 0 var(--s4);display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;font-weight:600;letter-spacing:-.01em}
.card h2 .n{font:500 11px var(--mono);color:var(--tx3);letter-spacing:.04em;min-width:22px}
.card p,.card li,.card .small,.kpi .l,.kpi .v,.verdict,.reco{overflow-wrap:anywhere}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:500;line-height:1.5;border:1px solid transparent;vertical-align:middle}
.b-dato{background:#eef7f0;color:var(--ok);border-color:#cfe6d5}.b-ipo{background:#fbf5e8;color:var(--warn);border-color:#ecdcb8}.b-esc{background:#fbeeee;color:var(--bad);border-color:#efc9c9}
.b-alta{background:#eef7f0;color:var(--ok)}.b-media{background:#fbf5e8;color:var(--warn)}.b-bassa{background:#fbeeee;color:var(--bad)}
.b-loc{background:var(--loc);color:#fff}.b-cld{background:var(--cld);color:#fff}.b-neu{background:var(--surface2);color:var(--tx2);border-color:var(--line)}
.b-ok{background:#eef7f0;color:var(--ok)}.b-ko{background:#fbeeee;color:var(--bad)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin:0 0 var(--s4)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;border-left-width:3px;border-left-color:var(--line2)}
.kpi.loc{border-left-color:var(--loc)}.kpi.cld{border-left-color:var(--cld)}.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:var(--warn)}
.kpi .v{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--tx2);margin-top:3px}.kpi .d{font-size:11px;color:var(--tx3);margin-top:3px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
th{color:var(--tx3);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
tbody tr:hover td,table tr:hover td{background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.card table.kv tr>td:first-child{width:58%;color:var(--tx2)}
.tw{overflow:visible}.tw table{table-layout:fixed}
svg{display:block;max-width:100%;width:100%;height:auto;overflow:visible;font-family:var(--font)}
svg text{font-variant-numeric:tabular-nums}
svg rect,svg circle,svg polygon{transition:opacity .15s}
.hl-dim{opacity:.3}
.legend{display:flex;gap:var(--s4);font-size:11.5px;color:var(--tx2);margin:var(--s2) 0;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cols2{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:var(--s5)}.cols2>*{min-width:0}
@media(max-width:800px){.cols2{grid-template-columns:1fr}}
.alt{border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--surface2);border:1px solid var(--line)}
.alt h5{margin:0 0 var(--s2);font-size:13px;font-weight:600}
.alt.loc{border-top:2px solid var(--loc)}.alt.cld{border-top:2px solid var(--cld)}
ul,ol{margin:var(--s1) 0;padding-left:18px}li{margin:3px 0}
.reco{font-size:14px;line-height:1.6}.reco strong.loc,.reco strong.cld{font-weight:600;border-bottom:2px solid currentColor}
.reco strong.loc{color:var(--loc)}.reco strong.cld{color:var(--cld)}
.verdict{font-size:16px;font-weight:600;padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s3);background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--tx);color:var(--tx)}
.verdict.v-loc{border-left-color:var(--loc)}.verdict.v-cld{border-left-color:var(--cld)}.verdict.v-warn{border-left-color:var(--warn)}.verdict.v-bad{border-left-color:var(--bad)}
.small{font-size:11.5px;color:var(--tx2)}
.formula{font:11.5px/1.6 var(--mono);background:var(--surface2);padding:10px 12px;border-radius:var(--r-sm);color:var(--tx);overflow:hidden;white-space:pre-wrap;border:1px solid var(--line)}
.tip{position:fixed;z-index:99;pointer-events:none;background:var(--tx);color:#fff;border-radius:var(--r-sm);padding:6px 10px;font-size:12px;box-shadow:0 8px 24px rgba(17,24,39,.18);display:none;max-width:280px;line-height:1.45}
.tip .small{color:#cbd2dc}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:var(--s4);margin:var(--s2) 0 calc(-1*var(--s2))}
.divider span{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--line2)}
/* quick panel */
.quick-wrap{max-width:1900px;margin:0 auto;padding:0 var(--s5)}
#quick{display:none;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:var(--s5);box-shadow:0 8px 30px rgba(17,24,39,.08);margin-top:var(--s4)}
#quick.on{display:block}
#quick h2{margin:0 0 var(--s1);font-size:15px;font-weight:600}
#quick h2:before{content:'Fase 1';font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-right:var(--s3)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s3) var(--s4);margin:var(--s4) 0}
.qf label{font-size:12px;color:var(--tx);display:block}.qf label small{display:block;color:var(--tx3);font-size:10.5px;line-height:1.35}
.qf input,.qf select{margin-top:4px}
.qf .q{display:inline-block;font:500 10.5px var(--mono);color:var(--tx3);margin-right:6px;min-width:18px}
#quick textarea{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--line);color:var(--tx);border-radius:var(--r-sm);padding:10px;font:11.5px/1.5 var(--mono);margin-top:var(--s3)}
.qres{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s4);margin-top:var(--s3)}
.gauge{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--loc),var(--line2) 50%,var(--cld));position:relative;margin:var(--s3) 0}
.gauge i{position:absolute;top:-6px;width:2px;height:18px;background:var(--tx);transform:translateX(-1px)}
code{font:12px var(--mono);background:var(--surface2);padding:1px 5px;border-radius:4px}
@media print{header,aside,#quick{display:none}main{display:block;padding:0}#cards{grid-template-columns:1fr}.card{break-inside:avoid;margin-bottom:var(--s3);border-color:#ccc}}

/* ---- v2.3 rilievo laterale (grigio metallizzato) ---- */
:root{--m0:#ffffff;--m1:#eef0f3;--m2:#d9dde3;--m3:#c3c8d0;--m4:#aab0ba}
.card,.kpi,aside,.verdict,.quick-result,.overlay-box{
  background:linear-gradient(180deg,var(--m0) 0%,#f7f8fa 100%);
  border:1px solid var(--m2);
  box-shadow:
    inset 0 1px 0 #fff,
    inset -1px 0 0 var(--m1),
    2px 0 0 var(--m2), 4px 0 0 var(--m3),
    0 2px 0 var(--m2), 0 4px 0 var(--m3),
    4px 4px 0 var(--m3), 4px 6px 10px rgba(60,66,78,.10);
  border-radius:var(--r);
}
.kpi{box-shadow:inset 0 1px 0 #fff,1px 0 0 var(--m2),2px 0 0 var(--m3),0 1px 0 var(--m2),0 2px 0 var(--m3),2px 2px 0 var(--m3),2px 3px 6px rgba(60,66,78,.08)}
.kpi.loc{border-left-color:var(--loc)}.kpi.cld{border-left-color:var(--cld)}
.card{transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-1px,-1px);box-shadow:inset 0 1px 0 #fff,inset -1px 0 0 var(--m1),3px 0 0 var(--m2),5px 0 0 var(--m3),0 3px 0 var(--m2),0 5px 0 var(--m3),5px 5px 0 var(--m3),6px 8px 14px rgba(60,66,78,.14)}
.tabs button,.btn,button.primary,button.ghost,button,button.primary:hover{
  background:linear-gradient(180deg,#eceef2,#dadee4);color:var(--tx)!important;text-shadow:0 1px 0 #fff;border:1px solid var(--m2);
  box-shadow:inset 0 1px 0 #fff,1px 1px 0 var(--m3),1px 2px 0 var(--m3),2px 3px 4px rgba(60,66,78,.10)}
.tabs button:active,.btn:active,button.primary:active{transform:translate(1px,1px);box-shadow:inset 0 1px 2px rgba(60,66,78,.25)}
.tabs button.active{color:var(--tx);font-weight:600;background:linear-gradient(180deg,#d3d8df,#c9cfd7);box-shadow:inset 0 2px 3px rgba(60,66,78,.22),inset 0 -1px 0 #fff}
/* tabelle: righe in mini-conche (rilievo inverso) */
table{border-collapse:separate;border-spacing:0 4px}
tbody td,table tr td{background:linear-gradient(180deg,#eceef2 0%,#f4f5f7 40%,#fafbfc 100%);
  border-top:1px solid var(--m3);border-bottom:1px solid #fff;
  box-shadow:inset 0 2px 3px rgba(60,66,78,.16),inset 0 -1px 0 #fff}
tbody td:first-child,table tr td:first-child{border-left:1px solid var(--m3);border-radius:6px 0 0 6px;box-shadow:inset 2px 2px 3px rgba(60,66,78,.16),inset 0 -1px 0 #fff}
tbody td:last-child,table tr td:last-child{border-right:1px solid #fff;border-radius:0 6px 6px 0;box-shadow:inset 0 2px 3px rgba(60,66,78,.16),inset -1px -1px 0 #fff}
tbody tr:hover td,table tr:hover td{background:linear-gradient(180deg,#e6e9ee 0%,#f1f3f6 40%,#f8f9fb 100%)}
th{border-bottom:1px solid var(--m3);background:transparent;box-shadow:none}
.tt td{box-shadow:none;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
.tt{border-spacing:0}
button.primary,button.primary:hover{background:linear-gradient(180deg,#dfe3e8,#c9cfd7);border-color:var(--m4);font-weight:600}
button:hover{background:linear-gradient(180deg,#f2f4f6,#e2e5ea)}
@media print{.card,.kpi,aside,.verdict{box-shadow:none}td{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div><h1>Simulatore v2 — AI Locale (open-weight) vs Cloud + API</h1>
  <div class="sub">Tempo per task (prefill/decode), fisica GPU, data warehouse co-locato e contesa risorse, catalogo integrazioni (DB, ERP, e-commerce, pagamenti, sicurezza), stagionalità, TCO NPV, scenari, sensitività</div></div>
  <a href="guida.html" target="_blank" rel="noopener" id="guideLink" style="display:inline-block;text-decoration:none"><button type="button" title="Guida all'uso e glossario (nuova scheda)">Guida</button></a>
  <button onclick="toggleQuick()" id="quickBtn" style="border-color:var(--loc)">Pre-valutazione rapida</button>
  <button class="primary" onclick="run()">Calcola</button>
  <button onclick="exportJSON()">Esporta JSON</button>
  <button onclick="importJSON()">Importa JSON</button>
  <button onclick="window.print()">Stampa</button>
  <button onclick="resetAll()">Reset</button>
  <input type="file" id="fileIn" accept="application/json" style="display:none">
  <span id="status"></span>
</header>
<div class="quick-wrap"><section id="quick"></section></div>
<main>
<aside><div class="tabs" id="tabs"></div><div class="tabbody" id="form"></div></aside>
<section id="cards"></section>
</main>

<script>
/* =========================================================================
   1. CATALOGHI: GPU, TASK, INTEGRAZIONI
   Tutti i valori sono IPOTESI di partenza da sostituire con quotazioni/benchmark.
   ========================================================================= */
const GPU_CATALOG={
 'H100 SXM 80GB':{vram:80,bw:3350,tflops:990,tdp:700,price:30000,pcie:false},
 'H100 PCIe 80GB':{vram:80,bw:2000,tflops:756,tdp:350,price:28000,pcie:true},
 'H100 NVL 94GB':{vram:94,bw:3900,tflops:836,tdp:400,price:32000,pcie:true},
 'H200 SXM 141GB':{vram:141,bw:4800,tflops:990,tdp:700,price:36000,pcie:false},
 'H200 NVL 141GB':{vram:141,bw:4800,tflops:836,tdp:600,price:34000,pcie:true},
 'A100 SXM 80GB':{vram:80,bw:2039,tflops:312,tdp:400,price:15000,pcie:false},
 'L40S 48GB':{vram:48,bw:864,tflops:362,tdp:350,price:9000,pcie:true},
 'RTX 6000 Ada 48GB':{vram:48,bw:960,tflops:365,tdp:300,price:7500,pcie:true},
 'Personalizzata':{vram:80,bw:3000,tflops:800,tdp:500,price:25000,pcie:true},
};
/* Task: n/giorno, token input, token cache, output, latenza max (s), interattivo (1) o batch (0), tool call, TB scansionati DWH per task, qa = quota del task soggetta a revisione/errore (1 = piena, 0.02 = campionamento) */
const DEFAULT_TASKS=[
 {name:'Assistente clienti (chat/e-commerce)',per_day:8000,inp:2500,cached:3000,out:400,lat:15,interactive:1,tools:4,scan_tb:0,qa:1},
 {name:'Analisi documentale complessa (64k token)',per_day:150,inp:64000,cached:8000,out:2500,lat:90,interactive:1,tools:1,scan_tb:0,qa:1},
 {name:'Report analitico su DWH (0.5 TB scan)',per_day:60,inp:15000,cached:5000,out:1500,lat:60,interactive:1,tools:3,scan_tb:0.5,qa:1},
 {name:'Classificazione batch notturna',per_day:60000,inp:800,cached:400,out:50,lat:3600,interactive:0,tools:0,scan_tb:0,qa:0.02},
];
/* Integrazioni: capex locale, opex locale/anno, cloud €/mese, ore integrazione, ore compliance/sicurezza/anno, latenza ms per chiamata, ore/anno gestione */
const INTEGRATIONS=[
 ['db_tx','Database transazionale (PostgreSQL/SQL Server HA)',1,{capex:18000,opex:4000,cloud_m:700,hours:80,comp_h:20,lat_ms:15,ops_h:60}],
 ['erp','ERP (SAP/Dynamics/Odoo) — connettori e API',1,{capex:6000,opex:8000,cloud_m:600,hours:220,comp_h:10,lat_ms:250,ops_h:80}],
 ['crm','CRM (Salesforce/HubSpot/Dynamics)',1,{capex:0,opex:3000,cloud_m:250,hours:120,comp_h:10,lat_ms:200,ops_h:40}],

let S={},TASKS=[],INTEG={},DIRTY=new Set(),META={};
function defaults(){const o={};SECTIONS.forEach(s=>s.fields.forEach(f=>{const d=f[3];o[f[0]]=(d&&typeof d==='object')?(d.sel?d.sel[0]:d.txt!==undefined?d.txt:d.chk):d;}));return o;}
function defaultMeta(){const m={};SRC_SECTIONS.forEach(s=>m[s]={source:'',date:'',conf:'media'});return m;}
function defaultInteg(){const o={};INTEGRATIONS.forEach(([k,,on,v])=>o[k]={on:!!on,...v});return o;}

/* ================= FORM ================= */
function parseNum(v){if(typeof v==='number')return v;v=String(v).trim().replace(/\s/g,'');if(v.includes(',')&&v.includes('.')){v=v.replace(/\./g,'').replace(',','.');}else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)){v=v.replace(/\./g,'');}else v=v.replace(',','.');const n=parseFloat(v);return isFinite(n)?n:null;}
function buildForm(){
  const tabs=document.getElementById('tabs'),form=document.getElementById('form');tabs.innerHTML='';form.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const b=document.createElement('button');b.textContent=s.id+' · '+s.title;b.className=i===0?'active':'';
    b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));document.getElementById('sec'+s.id).classList.add('active');};
    tabs.appendChild(b);
    const d=document.createElement('div');d.className='sec'+(i===0?' active':'');d.id='sec'+s.id;
    let h=`<h3>${s.id}. ${s.title}</h3>`;
    if(s.id==='A')h+=`<div class="note">Ora di punta e picco stagionale determinano la <b>concorrenza</b> che dimensiona le GPU locali; il cloud paga solo i token.</div>`;
    if(s.id==='B')h+=`<div class="note"><b>Catalogo task</b>: ogni riga è un tipo di lavoro con volume, token e latenza massima. Il tempo per task è calcolato per entrambe le alternative (prefill + decode + tool call).</div><div id="tasks"></div><button class="mini" onclick="addTask()">+ Aggiungi task</button>`;
    if(s.id==='C')h+=`<div class="note">Il tempo di decode ≈ byte dei pesi ÷ (banda × MBU); il prefill ≈ 2·parametri attivi·token ÷ (FLOPS × MFU). Se hai un benchmark misurato inseriscilo in "throughput misurato": prevale sulla stima.</div>`;
    if(s.id==='E')h+=`<div class="note">Il DWH è dimensionato su scansione (TB/s) e concorrenza, <b>separatamente</b> dalle GPU del modello. Se scegli analytics GPU co-locata, il simulatore sottrae capacità all'inferenza e aggiunge GPU.</div>`;
    if(s.id==='F')h+=`<div class="note">Seleziona i sistemi con cui il modello deve integrarsi. Ogni voce porta CAPEX/OPEX locale, canone cloud, ore di integrazione (uguali nelle due alternative), ore compliance annue e latenza per chiamata.</div><div id="integ" class="integ"></div>`;
    if(SRC_SECTIONS.includes(s.id))h+=`<div class="src"><input placeholder="Fonte / quotazione / URL" data-meta="${s.id}.source"><input placeholder="Data" data-meta="${s.id}.date"><select data-meta="${s.id}.conf"><option value="alta">conf. alta</option><option value="media" selected>conf. media</option><option value="bassa">conf. bassa</option></select></div>`;
    s.fields.forEach(f=>{const [k,l,u,d,hint]=f;
      if(d&&typeof d==='object'&&d.chk!==undefined){h+=`<div class="chk"><input type="checkbox" id="in_${k}" data-k="${k}"><label for="in_${k}">${l}<small style="display:block;color:var(--tx2)">${hint}</small></label></div>`;return;}
      let inp;
      if(d&&typeof d==='object'&&d.sel)inp=`<select id="in_${k}" data-k="${k}">${d.sel.map(o=>`<option>${o}</option>`).join('')}</select>`;
      else if(d&&typeof d==='object'&&d.txt!==undefined)inp=`<input id="in_${k}" data-k="${k}" type="text">`;
      else inp=`<div class="u"><input id="in_${k}" data-k="${k}" type="text" inputmode="decimal" data-num="1" autocomplete="off"><span>${u}</span></div>`;
      h+=`<div class="f"><label title="${hint}">${l}${hint?`<small>${hint}</small>`:''}</label>${inp}</div>`;});
    d.innerHTML=h;form.appendChild(d);
  });
  form.addEventListener('input',onEdit);form.addEventListener('change',onEdit);
}
function onEdit(e){const t=e.target;
  if(t.dataset.k){if(readField(t)){DIRTY.add(t.dataset.k);t.classList.add('dirty');if(t.dataset.k==='gpu_model')applyGpuPreset();schedule();}}
  else if(t.dataset.meta){const [s,p]=t.dataset.meta.split('.');META[s][p]=t.value;schedule();}
  else if(t.dataset.task!==undefined){const i=+t.dataset.task,f=t.dataset.f;if(f==='name')TASKS[i].name=t.value;else if(f==='interactive')TASKS[i].interactive=t.checked?1:0;else{const n=parseNum(t.value);if(n!==null)TASKS[i][f]=n;}schedule();}
  else if(t.dataset.integ){const [k,f]=t.dataset.integ.split('.');if(f==='on')INTEG[k].on=t.checked;else{const n=parseNum(t.value);if(n!==null)INTEG[k][f]=n;}schedule();}
}
function readField(t){const k=t.dataset.k;if(t.type==='checkbox')S[k]=t.checked;else if(t.dataset.num){const n=parseNum(t.value);if(n===null){t.style.borderColor='var(--bad)';return false;}t.style.borderColor='';S[k]=n;}else S[k]=t.value;return true;}

  /* 14 raccomandazione */

  if(locEx&&cldEx){verdict='Nessuna alternativa soddisfa i vincoli e gli SLA per task: rivedere task, modello o requisiti.';vcls='bad';}

  else{verdict=(winner==='loc'?'Locale':'Cloud + API')+' preferibile nello scenario base, margine '+fmt(relDiff*100,0)+'%.';vcls=winner;}
  const scen=[Rp,R,Rf].map(x=>x.adjL<x.adjC?'L':'C'),robust=scen.every(x=>x===scen[0]);
  const koL=R.tasks.filter(t=>!t.l_ok).map(t=>t.name),koC=R.tasks.filter(t=>!t.c_ok).map(t=>t.name);
  out.push(card(14,'Raccomandazione condizionata',`<div class="verdict v-${vcls}">${verdict}</div>

   <p><strong class="cld">Cloud + API conviene se</strong>: il carico è variabile (picco ×${s.seasonal_peak_multiplier}, crescita ${s.expected_growth_year}%) o incerto; i task lunghi (${R.tasks.filter(t=>t.longctx).map(t=>t.name).join(', ')||'nessuno'}) restano sotto il rate limit e il sovrapprezzo long-context è accettabile; il DWH a consumo (${kE(R.dwhY1.cost)}/anno) resta sotto il costo dei nodi dedicati; il differenziale di qualità (${s.quality_pass_rate_api}% vs ${s.quality_pass_rate_local}%) riduce revisione ed errori; il go-live in ${R.monthsC} mesi ha valore; il contratto consente il trattamento dei dati presso il provider.</p>

  document.getElementById('cards').innerHTML=out.join('');bindTips();

function quickToFull(q){
  const s=defaults(),uc=UC[q.q_use_case],tm=TEAM[q.q_team],gap=GAP[q.q_quality_gap];
  const b=Math.max(1,q.q_model_b);
  s.analysis_horizon_years=Math.max(1,Math.round(q.q_horizon));s.expected_growth_year=q.q_growth;s.seasonal_peak_multiplier=Math.max(1,q.q_peak);
  s.go_live_deadline_months=q.q_deadline;s.annual_business_benefit=q.q_benefit;s.delay_cost_month=q.q_benefit/12*0.5;s.capex_budget_max=0;
  s.local_model_id=`open-weight ${b}B`;s.local_model_parameters_b=b;s.active_parameters_b=b>=200?Math.round(b*0.15):b; // >200B assunto MoE
  s.quantization_bits=b>=30?8:16;s.kv_bytes_per_token_kb=Math.round(Math.min(400,Math.max(60,b*2.3)));
  s.gpu_model=pickGpu(b);const g=GPU_CATALOG[s.gpu_model];s.gpu_vram_gb=g.vram;s.gpu_bandwidth_gbs=g.bw;s.gpu_tflops=g.tflops;s.gpu_tdp_w=g.tdp;s.gpu_price=g.price;
  s.quality_pass_rate_api=92;s.quality_pass_rate_local=92-gap;s.human_review_rate_local=3+gap*0.6;s.human_review_rate_api=3;s.unsafe_action_rate_local=0.35+gap*0.06;
  s.local_fte=tm.fteL;s.cloud_fte=tm.fteC;s.procurement_months=tm.procure;s.local_impl_months=tm.implL;s.cloud_impl_months=tm.implC;s.local_outage_probability=tm.outage;
  s.fit_ops_local=tm.fitL;s.fit_ops_cloud=tm.fitC;
  /* dati */
  s.raw_data_tb=q.q_dwh_tb*0.65;s.curated_data_tb=q.q_dwh_tb*0.35;s.vector_count=Math.round(Math.max(1e5,q.q_dwh_tb*5e5));
  s.power_available_kw=q.q_team.startsWith('Forte')?200:q.q_team.startsWith('Buona')?60:25;
  /* sensibilità dati */
  const sens=q.q_data_sens;
  if(sens.startsWith('Critica')){s.c_payload_forbidden=true;}
  if(sens.startsWith('Alta')){s.managed_security_month*=1.6;s.compliance_rate_hour=130;s.fit_net_cloud=2;}
  if(sens.startsWith('Bassa')){s.fit_net_local=3;}
  /* sviluppo scalato su integrazioni e complessità */
  const nInt=Math.max(0,Math.round(q.q_integrations));
  s.integration_hours=0; // le ore vengono dalle integrazioni selezionate
  s.backend_hours=400+nInt*40;s.frontend_hours=uc.inter>=1?300:150;s.data_engineering_hours=q.q_dwh_tb>0?250+q.q_dwh_tb*8:120;
  /* task */
  const inter=uc.inter,n=q.q_tasks_day;
  const tasks=[{name:q.q_use_case+' (interattivo)',per_day:Math.round(n*inter),inp:uc.inp,cached:uc.cached,out:uc.out,lat:uc.lat,interactive:1,tools:uc.tools,scan_tb:0,qa:1}];
  if(inter<1)tasks.push({name:q.q_use_case+' (batch)',per_day:Math.round(n*(1-inter)),inp:uc.inp,cached:uc.cached,out:uc.out,lat:3600,interactive:0,tools:uc.tools,scan_tb:0,qa:0.1});
  if(q.q_dwh_tb>0&&(uc.scan>0||q.q_use_case.includes('DWH')))tasks.push({name:'Report analitico su DWH',per_day:Math.max(5,Math.round(n*0.05)),inp:15000,cached:4000,out:1500,lat:60,interactive:1,tools:3,scan_tb:Math.min(q.q_dwh_tb*0.2,2),qa:1});
  else if(q.q_dwh_tb>0)tasks.push({name:'Query analitiche di supporto',per_day:Math.max(5,Math.round(n*0.02)),inp:6000,cached:2000,out:800,lat:45,interactive:1,tools:2,scan_tb:Math.min(q.q_dwh_tb*0.05,0.5),qa:1});
  /* integrazioni: prime nInt della lista tipica del caso d'uso, poi altre */
  const integ=defaultInteg();Object.keys(integ).forEach(k=>integ[k].on=false);
  const order=[...uc.integ,...INTEGRATIONS.map(i=>i[0]).filter(k=>!uc.integ.includes(k)&&k!=='dr')];
  order.slice(0,nInt).forEach(k=>integ[k].on=true);
  if(tm.fteL<=1.5&&q.q_users>5000)integ.dr.on=true;
  return{s,tasks,integ};
}
/* Scorecard euristico (assi separati dal TCO) */
function quickScorecard(q,R){
  const tm=TEAM[q.q_team],gap=GAP[q.q_quality_gap];const tokDay=R.annual_tokens/S.working_days_year;
  const items=[
   {k:'Volume e utilizzazione',w:3,loc:R.gpu_util>=0.5?5:R.gpu_util>=0.3?4:R.gpu_util>=0.15?2:1,cld:R.gpu_util>=0.5?3:5,why:`${fmt(tokDay/1e6,1)} M token/giorno · utilizzazione GPU ${fmt(R.gpu_util*100,0)}% (soglia self-hosting 50–60%)`},
   {k:'Prevedibilità del carico',w:2,loc:q.q_peak<=1.5?5:q.q_peak<=2.5?3:1,cld:q.q_peak<=1.5?3:5,why:`picco/media ×${q.q_peak}, crescita ${q.q_growth}%/anno`},
   {k:'Sensibilità dati / sovranità',w:3,loc:q.q_data_sens.startsWith('Critica')?5:q.q_data_sens.startsWith('Alta')?4:3,cld:q.q_data_sens.startsWith('Critica')?0:q.q_data_sens.startsWith('Alta')?2:q.q_data_sens.startsWith('Media')?4:5,why:q.q_data_sens},
   {k:'Qualità del modello open-weight',w:3,loc:gap===0?5:gap<=4?4:gap<=7?2:1,cld:5,why:q.q_quality_gap},
   {k:'Capacità operativa interna',w:3,loc:tm.fitL,cld:tm.fitC,why:q.q_team},
   {k:'Time-to-value',w:2,loc:R.monthsL<=q.q_deadline?(R.monthsL<=q.q_deadline*0.7?4:3):0,cld:R.monthsC<=q.q_deadline?5:0,why:`locale ${R.monthsL} mesi · cloud ${R.monthsC} mesi · scadenza ${q.q_deadline}`},
   {k:'Budget',w:3,loc:R.adjL<=q.q_budget?(R.adjL<=q.q_budget*0.8?5:3):0,cld:R.adjC<=q.q_budget?(R.adjC<=q.q_budget*0.8?5:3):0,why:`TCO corretto locale ${kE(R.adjL)} · cloud ${kE(R.adjC)} · budget ${kE(q.q_budget)}`},
   {k:'Complessità integrazioni',w:1,loc:q.q_integrations>=6?4:3,cld:q.q_integrations>=6?3:4,why:`${q.q_integrations} sistemi; on-prem legacy favorisce la latenza locale`},
   {k:'Orizzonte di ammortamento',w:2,loc:q.q_horizon>=4?5:q.q_horizon>=3?3:1,cld:4,why:`${q.q_horizon} anni (hardware ammortizzato in 4)`},
  ];
  const W=items.reduce((a,i)=>a+i.w,0),sl=items.reduce((a,i)=>a+i.w*i.loc,0)/W,sc=items.reduce((a,i)=>a+i.w*i.cld,0)/W;
  return{items,sl,sc};
}

  <div class="qres"><div class="alt"><h5>Economia (stesso motore del simulatore)</h5><div class="kpis" style="margin:6px 0"><div class="kpi loc"><div class="v">${kE(R.adjL)}</div><div class="l">TCO corretto locale (${R.H} anni)</div></div><div class="kpi cld"><div class="v">${kE(R.adjC)}</div><div class="l">TCO corretto cloud + API</div></div><div class="kpi loc"><div class="v">${kE(R.netL)}</div><div class="l">valore netto locale</div></div><div class="kpi cld"><div class="v">${kE(R.netC)}</div><div class="l">valore netto cloud</div></div></div>
   <table class="kv">${row('Budget',kE(Q.q_budget)+' → locale '+(R.adjL<=Q.q_budget?badge('ok','entro'):badge('ko','oltre'))+' · cloud '+(R.adjC<=Q.q_budget?badge('ok','entro'):badge('ko','oltre')))}${row('Tempi',`locale ${R.monthsL} mesi ${R.monthsL<=Q.q_deadline?badge('ok','ok'):badge('ko','KO')} · cloud ${R.monthsC} mesi ${R.monthsC<=Q.q_deadline?badge('ok','ok'):badge('ko','KO')}`)}</table></div>
  <div class="alt"><h5>Infrastruttura stimata dal modello da ${Q.q_model_b}B</h5><table class="kv">${row('GPU consigliata',S.gpu_model)}${row('VRAM richiesta / GPU per replica',fmt(R.vram_needed,0)+' GB / TP='+R.tp)}${row('GPU totali (incl. failover)',R.gpu_count+' su '+R.servers+' server')}${row('Potenza (con PUE)',fmt1(R.peak_kw*S.pue)+' kW')}${row('Utilizzazione media GPU',fmt(R.gpu_util*100,0)+'%')}${row('Nodi DWH / storage',(R.dwh_cpu_nodes||0)+' nodi · '+fmt(R.storage_tb,0)+' TB')}${row('FTE locale / cloud',S.local_fte+' / '+S.cloud_fte)}${row('CAPEX locale',kE(R.local_capex))}${row('API anno 1',kE(R.apiY1.total))}</table></div></div>
  <h4 class="small" style="margin-top:12px">Scorecard di fit (0–5, pesato) — asse separato dall'economia</h4>
  <div class="gauge"><i style="left:${Math.max(0,Math.min(100,pos))}%"></i></div><div class="legend"><span><i style="background:${C.loc}"></i>Locale ${fmt(sc.sl,1)}/5</span><span style="margin-left:auto"><i style="background:${C.cld}"></i>Cloud + API ${fmt(sc.sc,1)}/5</span></div>
  <table><tr><th>Criterio</th><th class="num">Locale</th><th class="num">Cloud</th><th>Evidenza</th></tr>${rows}</table>
  <p class="small" style="margin-top:8px"><b>Prossimi passi per la valutazione disaggregata</b>: 1) eval del modello ${Q.q_model_b}B sul vostro caso d'uso (chiude il gap qualità, la variabile a più alto impatto); 2) misura reale di token e chiamate per task; 3) quotazione hardware completa e listino API datato; 4) verifica potenza/spazio e perimetro compliance. Tutte le card sottostanti sono già popolate con le ipotesi derivate: modificatele nei tab a sinistra.</p>`;
}
function quickFillExample(){Q={q_use_case:'Agente con azioni su ERP/CRM/pagamenti',q_users:12000,q_tasks_day:8000,q_peak:2.5,q_growth:35,q_model_b:70,q_quality_gap:'Piccolo (−3/−5 punti)',q_data_sens:'Alta — dati sanitari/finanziari, residenza UE obbligatoria',q_dwh_tb:12,q_integrations:7,q_budget:1500000,q_horizon:4,q_deadline:8,q_team:'Buona (DevOps + data engineer)',q_benefit:900000};renderQuick();runQuick();}
function quickToTextarea(){const o={};Object.entries(Q_ID_MAP).forEach(([k,n])=>o[n]=Q[k]);document.getElementById('qjson').value=JSON.stringify({quick:o},null,2);}
function applyQuickJSON(j){const inv=Object.fromEntries(Object.entries(Q_ID_MAP).map(([k,n])=>[n,k]));let n=0;Object.entries(j).forEach(([name,val])=>{const k=inv[name]||(Q_ID_MAP[name]?name:null);if(!k)return;const def=QUICK_VARS.find(v=>v[0]===k);if(def[2]==='sel'){const v=String(val).toLowerCase().trim();const opt=def[3].find(o=>o.toLowerCase()===v)||def[3].find(o=>o.toLowerCase().split(/[\s—(/]/)[0]===v.split(/[\s—(/]/)[0]);if(opt){Q[k]=opt;n++;}}else{const x=parseNum(val);if(x!==null){Q[k]=x;n++;}}});return n;}
function quickFromTextarea(){try{const j=JSON.parse(document.getElementById('qjson').value);Q=quickDefaults();const n=applyQuickJSON(j.quick||j);renderQuick();runQuick();document.getElementById('status').innerHTML+=` · JSON rapido: ${n} variabili applicate`;}catch(e){alert('JSON non valido: '+e.message);}}

/* ================= TOOLTIP INTERATTIVI ================= */
let TIP=null;
function bindTips(){
  if(!TIP){TIP=document.createElement('div');TIP.className='tip';document.body.appendChild(TIP);}
  document.querySelectorAll('svg [data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',e=>{TIP.innerHTML=el.dataset.tip;TIP.style.display='block';const svg=el.closest('svg');svg.querySelectorAll('rect,circle,polygon').forEach(x=>{if(x!==el)x.classList.add('hl-dim');});});
    el.addEventListener('mousemove',e=>{const x=Math.min(window.innerWidth-300,e.clientX+14),y=Math.max(8,e.clientY-40);TIP.style.left=x+'px';TIP.style.top=y+'px';});
    el.addEventListener('mouseleave',()=>{TIP.style.display='none';el.closest('svg').querySelectorAll('.hl-dim').forEach(x=>x.classList.remove('hl-dim'));});
  });
}
/* ================= GUIDA (fallback in-page) ================= */
function openGuideInline(){let o=document.getElementById('guideOverlay');if(!o){o=document.createElement('div');o.id='guideOverlay';o.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(246,247,249,.97);display:flex;flex-direction:column';o.innerHTML='<div style="display:flex;gap:10px;align-items:center;padding:8px 16px;background:#fff;border-bottom:1px solid #e3e6eb"><b>Guida all\'uso e glossario</b><button style="margin-left:auto" onclick="document.getElementById(\'guideOverlay\').remove()">Chiudi</button></div><iframe src="guida.html" style="flex:1;border:0;background:#f6f7f9"></iframe>';document.body.appendChild(o);}}
document.addEventListener('DOMContentLoaded',()=>{const l=document.getElementById('guideLink');if(l)l.addEventListener('click',e=>{const w=window.open(l.href,'_blank','noopener');if(!w){e.preventDefault();openGuideInline();}else e.preventDefault();});});
/* ================= AZIONI ================= */
let PREV=null;
function readAll(){document.querySelectorAll('#form [data-k]').forEach(readField);}
function run(){try{readAll();const R=compute(S,TASKS,INTEG);render(R);const st=document.getElementById('status');if(st){const d=PREV?(R.adjL-R.adjC)-(PREV.adjL-PREV.adjC):0;st.innerHTML='Calcolato '+new Date().toLocaleTimeString('it-IT')+' · TCO corr. L '+kE(R.adjL)+' / C '+kE(R.adjC)+' · '+S.gpu_model+' ('+R.gpu_count+' GPU, TP='+R.tp+')'+(PREV&&Math.abs(d)>0.5?' · Δ vs prec. <b style="color:'+(d<0?C.loc:C.cld)+'">'+(d>0?'+':'')+kE(d)+'</b>':'');}PREV=R;}catch(e){document.getElementById('cards').innerHTML=`<div class="card full"><h2>Errore di calcolo</h2><pre class="small">${e.stack||e.message}</pre></div>`;console.error(e);}}
function exportJSON(){const blob=new Blob([JSON.stringify({version:2,inputs:S,tasks:TASKS,integrations:INTEG,dato:[...DIRTY],meta:META,exported:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='simulazione_ai_locale_vs_cloud_v2.json';a.click();}
function importJSON(){const f=document.getElementById('fileIn');f.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(j.quick){Q=quickDefaults();const n=applyQuickJSON(j.quick);document.getElementById('quick').classList.add('on');renderQuick();runQuick();document.getElementById('status').innerHTML+=` · JSON rapido: ${n} variabili applicate`;f.value='';return;}S={...defaults(),...j.inputs};TASKS=j.tasks||JSON.parse(JSON.stringify(DEFAULT_TASKS));INTEG={...defaultInteg(),...(j.integrations||{})};DIRTY=new Set(j.dato||[]);META={...defaultMeta(),...(j.meta||{})};fillForm();run();}catch(e){alert('File non valido')}};fr.readAsText(f.files[0]);f.value='';};f.click();}
function resetAll(){S=defaults();TASKS=JSON.parse(JSON.stringify(DEFAULT_TASKS));INTEG=defaultInteg();DIRTY=new Set();META=defaultMeta();fillForm();run();}
window.getS=()=>S;window.getR=()=>PREV;window.getQ=()=>Q;Q=quickDefaults();
S=defaults();TASKS=JSON.parse(JSON.stringify(DEFAULT_TASKS));INTEG=defaultInteg();META=defaultMeta();buildForm();fillForm();run();

(function(){const T=()=>{if(!TIP){TIP=document.createElement('div');TIP.className='tip';document.body.appendChild(TIP);}return TIP;};function on(e){const el=e.target.closest&&e.target.closest('[data-tipname]');if(!el)return;const t=T();t.innerHTML='<b>Task</b><br>'+el.value.replace(/</g,'&lt;');t.style.display='block';}function mv(e){if(!e.target.closest||!e.target.closest('[data-tipname]'))return;const t=T();t.style.left=Math.min(window.innerWidth-300,e.clientX+14)+'px';t.style.top=Math.max(8,e.clientY-40)+'px';}function off(e){if(e.target.closest&&e.target.closest('[data-tipname]'))T().style.display='none';}document.addEventListener('mouseover',on);document.addEventListener('mousemove',mv);document.addEventListener('mouseout',off);document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('[data-tipname]'))T().style.display='none';});})();
</script>
